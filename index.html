<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>기형남 · Resta MIMI 포트폴리오</title>
<style>
  :root {
    --text: #37352f; --muted: #787774; --line: #e9e9e7; --bg: #f7f6f3;
    --blue: #2383e2; --purple: #7a4fd6; --green: #1f9e89;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { font-size: 32px; letter-spacing: -0.4px; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 16px; }
  .note {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; color: var(--muted); font-size: 13.5px; margin-bottom: 22px;
  }
  .cards { display: grid; gap: 14px; }
  a.card {
    display: block; text-decoration: none; color: inherit; background: #fff;
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: #cfcfcb; transform: translateY(-1px); }
  .bar { height: 8px; }
  .bar.backend { background: linear-gradient(90deg, #1f3b73, #2383e2); }
  .bar.admin { background: linear-gradient(90deg, #3b1f73, #7a4fd6); }
  .bar.app { background: linear-gradient(90deg, #0f4c4a, #1f9e89); }
  .body { padding: 18px 20px 20px; }
  .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 6px; }
  .desc { margin: 0; color: var(--muted); font-size: 14px; }
  footer { margin-top: 36px; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>기형남</h1>
    <p class="sub">Resta · MIMI 서비스 프로젝트 이력서</p>
    <div class="note">백엔드 · 병원 어드민/Haru · 환자 앱(RN) 세 문서를 나눠 두었습니다. 공개 GitHub Pages 링크입니다.</div>
    <div class="cards">
      <a class="card" href="./backend-mimi.html">
        <div class="bar backend"></div>
        <div class="body">
          <div class="label">Backend</div>
          <p class="title">resta_api · MIMI 백엔드</p>
          <p class="desc">NestJS 백엔드, 도메인·인프라·운영 경험</p>
        </div>
      </a>
      <a class="card" href="./admin-hospital-haru.html">
        <div class="bar admin"></div>
        <div class="body">
          <div class="label">Admin / Ops</div>
          <p class="title">병원 어드민 &amp; Haru Agent</p>
          <p class="desc">병원 운영 콘솔과 내부 어드민 도구</p>
        </div>
      </a>
      <a class="card" href="./app-patient-rn.html">
        <div class="bar app"></div>
        <div class="body">
          <div class="label">App</div>
          <p class="title">환자 앱 MIMI (React Native)</p>
          <p class="desc">환자용 모바일 앱 화면·연동</p>
        </div>
      </a>
    </div>
    <footer>© gamars80 · gamars-portfolio</footer>
  </div>
</body>
</html>
